# .github/workflows/tudovu-preview.yml — a short-lived environment per pull request.
#
# Deploys to the "tudovu-preview" GitHub Environment, which is what makes this safe: the
# role it assumes is trusted for that environment and nothing else, so protecting the environment
# in GitHub (required reviewers, a branch allow-list) gates previews before AWS is involved.
#
# It is NOT the deploy role. The preview role cannot create IAM identities, cannot reach RDS or
# Secrets Manager, and cannot touch any stack outside tudovu-preview-* — so it cannot
# delete the primary stack this repository actually serves from.
name: Tudovu Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Two pushes in quick succession must not run two deploys at the same stack.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork pull requests must NOT preview. GitHub withholds OIDC from them by default, so this is
    # not what stops it — but an incidental block reads as a bug to whoever hits it, and someone
    # "fixing" it would be working around a protection rather than removing a defect. Gated
    # explicitly so the reason is visible. Previewing a fork means building and running code from
    # outside the repository against credentials in the customer's account.
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: tudovu-preview
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TUDOVU_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1
      - name: Resolve names, tags and expiry
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SLUG=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          if [ -z "$SLUG" ]; then echo "Could not derive a stack name from the repository name."; exit 1; fi
          echo "PREVIEW_STACK=tudovu-preview-${SLUG}-pr${PR_NUMBER}" >> "$GITHUB_ENV"
          # The expiry a sweeper reads. Teardown on `closed` is not enough on its own: a
          # cancelled job or a revoked token leaks a stack that bills an ALB indefinitely.
          echo "EXPIRES_AT=$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v+24H +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Wait out any in-flight delete
        # A close-then-reopen can collide with a teardown still running — measured at 9m44s, so
        # this is not hypothetical. Creating into DELETE_IN_PROGRESS fails; waiting does not.
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$PREVIEW_STACK" --query "Stacks[0].StackStatus" --output text --region us-east-1 2>/dev/null || echo NONE)
          if [ "$STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "A previous teardown is still running; waiting for it."
            aws cloudformation wait stack-delete-complete --stack-name "$PREVIEW_STACK" --region us-east-1 || true
          fi
      - name: Build and push the image
        env:
          REPO_FULL: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.us-east-1.amazonaws.com"
          # A SEPARATE repository, never the one production pulls from. The preview role's push
          # grant is scoped to names ending -preview and explicitly denied everywhere else, so
          # this name is not a convention, it is the only thing that will work. Built from
          # unreviewed code by definition; letting it write where production reads would be a
          # supply chain that branch protection does not cover.
          REPO="$(echo "$REPO_FULL" | tr '[:upper:]' '[:lower:]' | tr '/' '-')-preview"
          aws ecr describe-repositories --repository-names "$REPO" --region us-east-1 >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" --region us-east-1 \
                 --tags "Key=tudovu:lifecycle,Value=preview" >/dev/null
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "${REGISTRY}/${REPO}:preview-${GIT_SHA}" .
          docker push "${REGISTRY}/${REPO}:preview-${GIT_SHA}"
          echo "IMAGE_URI=${REGISTRY}/${REPO}:preview-${GIT_SHA}" >> "$GITHUB_ENV"
      - name: Deploy the preview
        env:
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text --region us-east-1)
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then echo "No default VPC in us-east-1."; exit 1; fi
          SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" --query "Subnets[].SubnetId" --output text --region us-east-1 | tr '\t' ',')
          # Fall back to every subnet in the VPC. A default VPC whose subnets do not
          # auto-assign public IPs is common — the test account is one — and the container deploy
          # workflow has carried this same fallback for exactly that reason. Omitting it here made
          # the preview fail on an account where the real deploy works, which is the worst kind of
          # difference between the two.
          if [ -z "$SUBNET_IDS" ]; then SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query "Subnets[].SubnetId" --output text --region us-east-1 | tr '\t' ','); fi
          if [ -z "$SUBNET_IDS" ]; then echo "No subnets at all in $VPC_ID."; exit 1; fi
          aws cloudformation deploy \
            --template-file infra/preview.yaml \
            --stack-name "$PREVIEW_STACK" \
            --region us-east-1 \
            --parameter-overrides VpcId="$VPC_ID" PublicSubnetIds="$SUBNET_IDS" ImageUri="$IMAGE_URI" ExecutionRoleArn="${{ vars.TUDOVU_PREVIEW_EXEC_ROLE_ARN }}" \
            --tags "tudovu:repo=$REPO_FULL" "tudovu:stage=preview" "tudovu:lifecycle=preview" "tudovu:pr=$PR_NUMBER" "tudovu:expires-at=$EXPIRES_AT"
      - name: Check it is actually serving
        # The same assertions as the post-merge verification, minus the ones this profile
        # removed. A stack that reports CREATE_COMPLETE while nothing serves is the failure this
        # whole campaign was about — reporting it pre-merge is the entire point of a preview.
        id: verify
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$PREVIEW_STACK" --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text --region us-east-1)
          echo "APP_URL=$URL" >> "$GITHUB_ENV"
          TG=$(aws cloudformation describe-stacks --stack-name "$PREVIEW_STACK" --query "Stacks[0].Outputs[?OutputKey=='TargetGroupArn'].OutputValue" --output text --region us-east-1 2>/dev/null || echo "")
          if [ -n "$TG" ] && [ "$TG" != "None" ]; then
            aws elbv2 describe-target-health --target-group-arn "$TG" --region us-east-1 \
              --query "TargetHealthDescriptions[].{Port:Target.Port,State:TargetHealth.State}" --output table
            UNHEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$TG" --region us-east-1 --query "length(TargetHealthDescriptions[?TargetHealth.State!='healthy'])" --output text)
            if [ "$UNHEALTHY" != "0" ]; then echo "::error::Targets are not healthy — the app is not serving on port 3000."; exit 1; fi
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
          echo "GET $URL -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Preview did not return 200."; exit 1; }
      - name: Why the deploy failed
        if: failure()
        run: |
          echo "The stack did not deploy. CloudFormation's own reasons follow."
          aws cloudformation describe-stack-events --stack-name "$PREVIEW_STACK" --region us-east-1 \
            --query "reverse(StackEvents[?ResourceStatusReason!=null && ends_with(ResourceStatus, 'FAILED')].[ResourceStatus,LogicalResourceId,ResourceStatusReason])" \
            --output text 2>/dev/null | head -25 || true
          echo "--- current stack status ---"
          aws cloudformation describe-stacks --stack-name "$PREVIEW_STACK" --region us-east-1 \
            --query "Stacks[0].[StackStatus,StackStatusReason]" --output text 2>/dev/null || true
          # The single most important failure class produces NO failed stack events at all: a
          # service that cannot place a task leaves CloudFormation sitting in CREATE_IN_PROGRESS
          # while ECS retries, for up to three hours. Everything above prints nothing in that
          # case. The reason is in the ECS service's own event stream and in the stopped tasks —
          # measured live: a task that could not pull its image sat for 20 minutes with the
          # stack "in progress" and no signal anywhere else.
          echo "--- ECS service events (why tasks are not running) ---"
          CLUSTER=$(aws ecs list-clusters --region us-east-1 --query "clusterArns[?contains(@, '$PREVIEW_STACK')]|[0]" --output text 2>/dev/null)
          if [ -n "$CLUSTER" ] && [ "$CLUSTER" != "None" ]; then
            SVC=$(aws ecs list-services --cluster "$CLUSTER" --region us-east-1 --query "serviceArns[0]" --output text 2>/dev/null)
            aws ecs describe-services --cluster "$CLUSTER" --services "$SVC" --region us-east-1 \
              --query "services[0].events[:8].message" --output text 2>/dev/null || true
            echo "--- why the last tasks stopped ---"
            for t in $(aws ecs list-tasks --cluster "$CLUSTER" --desired-status STOPPED --region us-east-1 --query "taskArns[:3]" --output text 2>/dev/null); do
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$t" --region us-east-1 \
                --query "tasks[0].[stoppedReason,containers[0].reason]" --output text 2>/dev/null || true
            done
          fi
      - name: Say why it failed, on the pull request
        # The whole argument for previews is that service-never-healthy and stack-rollback become
        # PRE-merge signals. A red check with the reason buried in a log is not that — the reason
        # has to arrive where the reviewer already is. Same diagnostics the post-merge deploy
        # prints, posted as a comment.
        #
        # No backticks anywhere in the emitted script: it is inside a template literal, and a
        # nested one closes it. Values arrive by env for the same reason.
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '**Preview environment failed.**',
                '',
                "The run below prints CloudFormation's own failure reasons, the ECS service events,",
                'and why the last tasks stopped — which is usually the answer.',
                '',
                process.env.RUN_URL,
                '',
                'This is a preview, so nothing that serves your users changed. The next push to this',
                'branch deletes and recreates it.',
              ].join('\n'),
            });

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          APP_URL: ${{ env.APP_URL }}
          EXPIRES_AT: ${{ env.EXPIRES_AT }}
        with:
          script: |
            const body = [
              '**Preview environment**: ' + process.env.APP_URL,
              '',
              'Expires ' + process.env.EXPIRES_AT + '. It is torn down when this pull request closes;',
              'the expiry is the backstop for when that does not happen.',
              '',
              'No database and no secrets — an app that needs one will not start here, which the',
              'container smoke test already told you.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body && c.body.startsWith('**Preview environment**'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  teardown:
    # No fork gate here on purpose: nothing was ever created for a fork, so deleting is a no-op —
    # and gating it would mean a preview that somehow existed could never be torn down.
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    environment: tudovu-preview
    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TUDOVU_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1
      - name: Delete the preview stack
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SLUG=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          STACK="tudovu-preview-${SLUG}-pr${PR_NUMBER}"
          # The profile has no S3 bucket, no RDS and no secrets, so delete-stack IS the whole
          # cleanup — there is nothing left behind to orphan. That is the reason the profile is
          # defined this way, not a happy accident of trimming for speed.
          aws cloudformation delete-stack --stack-name "$STACK" --region us-east-1 || true
          aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region us-east-1 || true
          echo "Deleted $STACK (or it was already gone)."
